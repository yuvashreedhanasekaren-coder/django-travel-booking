<!DOCTYPE html>
<html>
<head>
<title>Edit Booking</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#6366f1,#8b5cf6);
    font-family:Segoe UI;
}
.card{
    background:white;
    width:420px;
    padding:35px;
    border-radius:18px;
    box-shadow:0 25px 50px rgba(0,0,0,.25);
}
h2{
    text-align:center;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:14px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">
<h2>Edit Booking</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="name" value="{{ booking.name }}" required>
<input type="number" name="age" value="{{ booking.age }}" required>
<input type="text" name="from_place" value="{{ booking.from_place }}" required>
<input type="text" name="to_place" value="{{ booking.to_place }}" required>
<input type="text" name="duration" value="{{ booking.duration }}" required>
<input type="number" name="budget" value="{{ booking.budget }}" required>

<button type="submit">Update Booking</button>
</form>

</div>

</body>
</html>
