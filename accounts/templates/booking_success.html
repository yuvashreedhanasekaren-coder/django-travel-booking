<!DOCTYPE html>
<html>
<head>
<title>Booking Success</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#22c55e,#4ade80);
    font-family:Segoe UI;
}
.card{
    background:white;
    padding:40px;
    width:420px;
    text-align:center;
    border-radius:20px;
    box-shadow:0 25px 50px rgba(0,0,0,.25);
}
h1{color:#16a34a;}
a{
    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#16a34a;
    color:white;
    border-radius:10px;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="card">
    <h1>🎉 Booking Successful!</h1>
    <p>Thank you <b>{{ name }}</b></p>

    <a href="{% url 'home' %}">Back to Home</a>
</div>

</body>
</html>
