<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Travel Booking{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: #4f46e5;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 40px;
        }
    </style>

</head>

<body>

<nav>

    <h2>
        <a href="{% url 'home' %}">✈ Travel Booking</a>
    </h2>

    <div>

        {% if user.is_authenticated %}

            <span style="color:#e0e7ff;">
                Welcome, {{ user.username }}
            </span>

            <a href="{% url 'home' %}">Home</a>

            <a href="{% url 'booking' %}">Book Trip</a>

            <a href="{% url 'booking_list' %}">My Bookings</a>

            <a href="{% url 'logout' %}">Logout</a>

        {% else %}

            <a href="{% url 'login' %}">Login</a>

            <a href="{% url 'register' %}">Register</a>

        {% endif %}

    </div>

</nav>


<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
