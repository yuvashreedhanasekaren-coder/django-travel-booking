<!DOCTYPE html>
<html>

<head>
    <title>Register</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #667eea, #764ba2);
            font-family: Arial;
        }

        .card {
            background: white;
            width: 360px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .login {
            text-align: center;
            margin-top: 15px;
        }

        .login a {
            text-decoration: none;
            font-weight: bold;
            color: #667eea;
        }
    </style>

</head>

<body>

<div class="card">

    <h2>Create Account</h2>

    {% if form.errors %}
        <div class="error">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>

    </form>

    <div class="login">
        Already registered?
        <a href="{% url 'login' %}">
            Login
        </a>
    </div>

</div>

</body>

</html>
