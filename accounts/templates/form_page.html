<!DOCTYPE html>
<html>
<head>
<title>Book Your Trip</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(120deg,#6366f1,#8b5cf6);
    font-family:Segoe UI, sans-serif;
}
.card{
    background:white;
    width:420px;
    padding:40px;
    border-radius:18px;
    box-shadow:0 25px 50px rgba(0,0,0,.25);
}
h2{
    text-align:center;
    margin-bottom:25px;
}
input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:14px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#4338ca;
}
</style>
</head>

<body>
<div class="card">
    <h2>Travel Booking Form</h2>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="number" name="age" placeholder="Age" required>
        <input type="text" name="from_place" placeholder="From" required>
        <input type="text" name="to_place" placeholder="To" required>
        <input type="number" name="duration" placeholder="Duration (Days)" required>
        <input type="number" name="budget" placeholder="Budget" required>

        <button type="submit">Confirm Booking</button>
    </form>
</div>
</body>
</html>
